name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: Reference implementation
        run: pytest -q
      - name: Workbook generator
        run: pytest -q tools
      - name: Every chapter can be taken in order
        run: python tools/check_workbooks.py
      - name: The whole game
        run: python -m tinybitcoin.demo

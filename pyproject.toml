[project]
name = "tiny-bitcoin"
version = "0.1.0"
description = "Learn how Bitcoin works by building a small but real one, one chapter at a time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # the implementation uses only the standard library

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinybitcoin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=...) would only add noise to teaching code
